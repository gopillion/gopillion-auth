server:
  port: 8081

spring:
  application.name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5433/auth_db
    username:
    password:
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  data.redis:
    host: localhost
    port: 6379

auth:
  jwt:
    issuer: gopillion-auth
    # Leave blank in local dev to auto-generate an ephemeral key pair (tokens die on restart).
    private-key-path: ${JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    access-ttl-minutes: 15
    temp-ttl-minutes: 10
  refresh:
    ttl-days: 7
  otp:
    ttl-seconds: 300
    max-attempts: 5
    max-sends-per-window: 3
    send-window-seconds: 600
    # DEV ONLY: if set, every OTP equals this value. Never set in prod.
    fixed-otp: ${AUTH_FIXED_OTP:}

springdoc:
  swagger-ui.path: /swagger-ui.html
